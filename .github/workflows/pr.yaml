name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  changed-files:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - '**'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CPPLINT.cfg'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run_python*.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_python*.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
        test_cpp:
          - '**'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run_python*.sh'
          - '!ci/test_python*.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
          - '!python/**'
        test_python_conda:
          - '**'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CPPLINT.cfg'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
          - '!python/distributed-ucxx/**'
        test_python_distributed_conda:
          - '**'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CPPLINT.cfg'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
        test_python_wheels:
          - '**'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CPPLINT.cfg'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_cpp.sh'
          - '!ci/build_docs.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_python*.sh'
          - '!conda/**'
          - '!docs/**'
          - '!python/distributed-ucxx/**'
        test_python_distributed_wheels:
          - '**'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CPPLINT.cfg'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_cpp.sh'
          - '!ci/build_docs.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_python*.sh'
          - '!conda/**'
          - '!docs/**'
  wheel-build-libucxx:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_libucxx.sh
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      package-name: libucxx
      package-type: cpp
      matrix_type: pull-request
  wheel-build-ucxx:
    needs: [build-details, wheel-build-libucxx]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_ucxx.sh
      package-name: ucxx
      package-type: python
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      matrix_type: pull-request
  wheel-tests-ucxx:
    needs: [wheel-build-ucxx, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: ci/test_wheel_ucxx.sh
      matrix_type: wsl-pr
