name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - wheel-build-libucxx
      - wheel-build-ucxx
      - wheel-tests-ucxx
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  wheel-build-libucxx:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_libucxx.sh
      # TEMPORARY: only build what the V100 / CUDA 12.2.2 / Python 3.12 test job needs (CUDA 12 wheels).
      matrix_filter: map(select(.ARCH == "amd64" and (.CUDA_VER | startswith("12.")) and .PY_VER == "3.12"))
      package-name: libucxx
      package-type: cpp
      matrix_type: pull-request
  wheel-build-ucxx:
    needs: [build-details, wheel-build-libucxx]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_ucxx.sh
      package-name: ucxx
      package-type: python
      # TEMPORARY: only build what the V100 / CUDA 12.2.2 / Python 3.12 test job needs (CUDA 12 wheels).
      matrix_filter: map(select(.ARCH == "amd64" and (.CUDA_VER | startswith("12.")) and .PY_VER == "3.12"))
      matrix_type: pull-request
  wheel-tests-ucxx:
    needs: [wheel-build-ucxx]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: ci/test_wheel_ucxx.sh
      # TEMPORARY: the pull-request test matrix has no V100 entry, so borrow the nightly matrix and
      # keep only the configuration that hangs in nightly CI (amd64, CUDA 12.2.2, py3.12, V100,
      # earliest driver).
      matrix_type: nightly
      matrix_filter: map(select(.ARCH == "amd64" and .GPU == "v100" and .CUDA_VER == "12.2.2" and .PY_VER == "3.12"))
